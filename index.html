<script>

const $ = (selector) =>
  document.querySelector(selector);


function esc(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(message){

  const old =
    document.querySelector(
      ".sanskritam-toast"
    );

  if(old){
    old.remove();
  }

  const div =
    document.createElement("div");

  div.className =
    "sanskritam-toast";

  div.textContent =
    message;

  div.style.cssText = `
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    background:#3d2b1f;
    color:white;
    padding:10px 18px;
    border-radius:30px;
    z-index:10000;
    font-size:14px;
  `;

  document.body.appendChild(div);

  setTimeout(
    () => div.remove(),
    2200
  );

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function show(id){

  document
    .querySelectorAll(
      "main section"
    )
    .forEach(section => {

      section.style.display =
        section.id === id
          ? "block"
          : "none";

    });

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });

  const buttons =
    document.querySelectorAll(
      ".nav-btn"
    );

  buttons.forEach(btn => {

    const onclick =
      btn.getAttribute(
        "onclick"
      ) || "";

    if(
      onclick.includes(
        `show('${id}')`
      )
    ){

      btn.classList.add(
        "active"
      );

    }

  });

}


/* =====================================================
   LANGUAGE
   ===================================================== */

let currentLanguage =
  localStorage.getItem(
    "sanskritamLanguage"
  ) || "gu";


function changeLanguage(lang){

  currentLanguage = lang;

  localStorage.setItem(
    "sanskritamLanguage",
    lang
  );

  toast(
    lang === "gu"
      ? "ગુજરાતી પસંદ કરેલ"
      : lang === "hi"
      ? "हिन्दी चुनी गई"
      : "English selected"
  );

}


/* =====================================================
   SPEECH
   ===================================================== */

function speakText(text){

  if(
    !("speechSynthesis" in window)
  ){

    toast(
      "તમારા browserમાં voice support નથી."
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    /[\u0900-\u097F]/.test(text)
      ? "hi-IN"
      : "en-US";

  utterance.rate = 0.85;

  speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   INITIAL SECTION
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    show("home");

  }
);

</script>

<script>

/* =====================================================
   BHAGAVAD GITA DATA
   ===================================================== */

const GITA_DATA_URL =
"https://cdn.jsdelivr.net/gh/ChiragMirani/gita-quotes@main/docs/data.json";

const GITA_HINDI_URL =
"https://raw.githubusercontent.com/kashishkhullar/gita_json/master/dataset_hindi.json";


const GITA_CHAPTERS = [

  "अर्जुनविषादयोग",
  "सांख्ययोग",
  "कर्मयोग",
  "ज्ञानकर्मसंन्यासयोग",
  "कर्मसंन्यासयोग",
  "आत्मसंयमयोग",
  "ज्ञानविज्ञानयोग",
  "अक्षरब्रह्मयोग",
  "राजविद्याराजगुह्ययोग",
  "विभूतियोग",
  "विश्वरूपदर्शनयोग",
  "भक्तियोग",
  "क्षेत्रक्षेत्रज्ञविभागयोग",
  "गुणत्रयविभागयोग",
  "पुरुषोत्तमयोग",
  "दैवासुरसम्पद्विभागयोग",
  "श्रद्धात्रयविभागयोग",
  "मोक्षसंन्यासयोग"

];


let GITA_ROWS = [];

let GITA_HINDI = [];

let gitaLoaded = false;

let gitaLoading = false;


/* =====================================================
   COMMON TEXT HELPERS
   ===================================================== */

function cleanText(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  if(
    typeof value === "string"
  ){
    return value.trim();
  }

  if(
    typeof value === "number"
  ){
    return String(value);
  }

  return "";

}


function firstText(...values){

  for(
    const value of values
  ){

    const text =
      cleanText(value);

    if(text){
      return text;
    }

  }

  return "";

}


/* =====================================================
   NORMALIZE GITA VERSE
   ===================================================== */

function normalizeGitaVerse(row){

  if(
    !row ||
    typeof row !== "object"
  ){
    return null;
  }


  const chapter = Number(

    row.chapter ??

    row.chapter_number ??

    row.chapterId ??

    row.chapter_id ??

    row.chapterNo ??

    row.CHAPTER

  );


  const verse = Number(

    row.verse ??

    row.verse_number ??

    row.verseId ??

    row.verse_id ??

    row.verseNo ??

    row.VERSE

  );


  const sanskrit =
    firstText(

      row.text,

      row.sanskrit,

      row.sloka,

      row.shloka,

      row.verse_text,

      row.verseSanskrit,

      row.VERSESANSKRIT,

      row.SANSKRIT

    );


  const english =
    firstText(

      row.translation,

      row.english,

      row.meaning,

      row.verseTranslation,

      row.englishTranslation,

      row.VERSEENGTRANSLATION

    );


  if(
    !chapter ||
    !verse ||
    !sanskrit
  ){
    return null;
  }


  return {

    id:
      `${chapter}.${verse}`,

    chapter,

    verse,

    sanskrit,

    english

  };

}


/* =====================================================
   EXTRACT GITA DATA
   ===================================================== */

function extractGitaRows(data){

  const output = [];


  function walk(value){

    if(!value){
      return;
    }


    if(
      Array.isArray(value)
    ){

      value.forEach(walk);

      return;

    }


    if(
      typeof value !== "object"
    ){
      return;
    }


    const normalized =
      normalizeGitaVerse(
        value
      );


    if(normalized){

      output.push(
        normalized
      );

    }


    Object.keys(value)
      .forEach(key => {

        if(
          key !== "text" &&
          key !== "sanskrit" &&
          key !== "translation" &&
          key !== "english" &&
          key !== "meaning"
        ){

          walk(
            value[key]
          );

        }

      });

  }


  walk(data);


  const unique =
    new Map();


  output.forEach(row => {

    unique.set(
      row.id,
      row
    );

  });


  return [
    ...unique.values()
  ].sort(

    (a,b) =>

      a.chapter -
      b.chapter ||

      a.verse -
      b.verse

  );

}


/* =====================================================
   HINDI GITA MEANING
   ===================================================== */

function findHindi(
  chapter,
  verse
){

  const id =
    `${chapter}.${verse}`;


  const found =
    GITA_HINDI.find(row => {

      const c = Number(

        row.chapter ??

        row.chapter_number ??

        row.chapterId ??

        row.chapter_id

      );


      const v = Number(

        row.verse ??

        row.verse_number ??

        row.verseId ??

        row.verse_id

      );


      return (
        `${c}.${v}` === id
      );

    });


  if(!found){
    return "";
  }


  return firstText(

    found.hindi,

    found.translation,

    found.meaning,

    found.text,

    found.description

  );

}


/* =====================================================
   ONLINE TRANSLATION
   ===================================================== */

async function translateText(
  text,
  target
){

  if(!text){
    return "";
  }


  try{

    const url =

      "https://translate.googleapis.com/translate_a/single" +

      "?client=gtx" +

      "&sl=auto" +

      "&tl=" +
      encodeURIComponent(
        target
      ) +

      "&dt=t" +

      "&q=" +
      encodeURIComponent(
        text
      );


    const response =
      await fetch(url);


    if(
      !response.ok
    ){

      throw new Error(
        "Translation HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      data &&
      Array.isArray(
        data[0]
      )
    ){

      return data[0]

        .map(part =>
          part &&
          part[0]
            ? part[0]
            : ""
        )

        .filter(Boolean)

        .join("");

    }

  }
  catch(error){

    console.warn(
      "Translation error:",
      error
    );

  }


  return "";

}


/* =====================================================
   LOAD GITA
   ===================================================== */

async function loadGita(){

  if(gitaLoaded){

    renderGita();

    return;

  }


  if(gitaLoading){
    return;
  }


  gitaLoading = true;


  const container =
    document.getElementById(
      "gita700List"
    );


  if(container){

    container.innerHTML = `

      <div class="card">

        📖 Bhagavad Gita
        loading...

      </div>

    `;

  }


  try{

    const responses =
      await Promise.all([

        fetch(
          GITA_DATA_URL
        ),

        fetch(
          GITA_HINDI_URL
        )

      ]);


    const mainResponse =
      responses[0];


    const hindiResponse =
      responses[1];


    if(
      !mainResponse.ok
    ){

      throw new Error(

        "Gita HTTP " +

        mainResponse.status

      );

    }


    const mainData =
      await mainResponse.json();


    GITA_ROWS =
      extractGitaRows(
        mainData
      );


    if(
      hindiResponse.ok
    ){

      const hindiData =
        await hindiResponse.json();


      if(
        Array.isArray(
          hindiData
        )
      ){

        GITA_HINDI =
          hindiData;

      }
      else{

        GITA_HINDI = [];

      }

    }


    gitaLoaded = true;


    console.log(

      "Gita verses loaded:",

      GITA_ROWS.length

    );


    renderGita();

  }
  catch(error){

    console.error(
      "Gita load error:",
      error
    );


    if(container){

      container.innerHTML = `

        <div class="card">

          ❌ Bhagavad Gita
          load થઈ શકી નથી.

          <br><br>

          Internet connection
          check કરીને ફરી try કરો.

        </div>

      `;

    }

  }
  finally{

    gitaLoading = false;

  }

}


/* =====================================================
   GITA CHAPTER LIST
   ===================================================== */

function renderGita(){

  const container =
    document.getElementById(
      "gita700List"
    );


  if(!container){
    return;
  }


  if(
    !GITA_ROWS.length
  ){

    container.innerHTML = `

      <div class="card">

        📖 Gita loading...

      </div>

    `;

    return;

  }


  let html = "";


  for(
    let chapter = 1;
    chapter <= 18;
    chapter++
  ){

    const verses =
      GITA_ROWS.filter(
        row =>
          row.chapter ===
          chapter
      );


    html += `

      <div
        class="card"
        onclick="
          renderGitaChapter(
            ${
