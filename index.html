<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<meta name="theme-color"
      content="#8f5">

<title>SANSKRITAM 🪷</title>

<style>

/* =====================================================
   BASIC
   ===================================================== */

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    "Noto Sans Gujarati",
    "Noto Sans Devanagari",
    Arial,
    sans-serif;

  background:#fffaf0;
  color:#3d2b1f;
}

/* =====================================================
   YOUR EXISTING CSS
   ===================================================== */

/*
   અહીં તમારું હાલનું આખું CSS
   exactly same રાખવાનું છે.

   બહારનું design/UI બદલવાનું નથી.
*/

</style>

</head>

<body>

<!-- ===================================================
     HEADER
     =================================================== -->

<header>

  <div>
    <b>SANSKRITAM 🪷</b>
  </div>

  <select
    id="languageSelect"
    onchange="changeLanguage(this.value)"
  >
    <option value="gu">ગુજરાતી</option>
    <option value="hi">हिन्दी</option>
    <option value="en">English</option>
  </select>

</header>


<!-- ===================================================
     MAIN
     =================================================== -->

<main>

<!-- ===================================================
     HOME
     =================================================== -->

<section id="home">

  <!-- તમારું હાલનું Home content અહીં જ રહેશે -->

</section>


<!-- ===================================================
     GITA
     =================================================== -->

<section id="gita">

  <div class="section-title">
    <h2>ભગવદ્ ગીતા 🕉️</h2>
  </div>

  <input
    id="gitaSearch"
    type="search"
    placeholder="🔍 શ્લોક શોધો..."
    oninput="searchGita()"
  >

  <div id="gita700List"></div>

</section>


<!-- ===================================================
     RAMAYANA
     =================================================== -->

<section id="ramayana">

  <div class="section-title">
    <h2>વાલ્મીકિ રામાયણ 🪷</h2>
  </div>

  <div id="ramayanaList"></div>

</section>


<!-- ===================================================
     GRANTHAS
     =================================================== -->

<section id="granthas">

  <!-- તમારું હાલનું Granth content અહીં જ રહેશે -->

</section>


<!-- ===================================================
     FAVORITES
     =================================================== -->

<section id="favorites">

  <div class="section-title">
    <h2>❤️ Saved</h2>
  </div>

  <div id="favoritesList"></div>

</section>


<!-- ===================================================
     POSTER
     =================================================== -->

<section id="poster">

  <!-- તમારું હાલનું Poster content અહીં જ રહેશે -->

</section>

</main>


<!-- ===================================================
     BOTTOM NAV
     =================================================== -->

<nav>

  <button
    class="nav-btn active"
    onclick="show('home')"
  >
    🏠
    <span>Home</span>
  </button>

  <button
    class="nav-btn"
    onclick="show('gita')"
  >
    🕉️
    <span>Gita</span>
  </button>

  <button
    class="nav-btn"
    onclick="show('ramayana')"
  >
    🪷
    <span>Ramayana</span>
  </button>

  <button
    class="nav-btn"
    onclick="show('granthas')"
  >
    📚
    <span>Granth</span>
  </button>

  <button
    class="nav-btn"
    onclick="show('favorites')"
  >
    ❤️
    <span>Saved</span>
  </button>

</nav>


<!-- ===================================================
     BASIC SCRIPT
     =================================================== -->

<script>

const $ = (selector) =>
  document.querySelector(selector);


function esc(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(message){

  const old =
    document.querySelector(
      ".sanskritam-toast"
    );

  if(old){
    old.remove();
  }

  const div =
    document.createElement("div");

  div.className =
    "sanskritam-toast";

  div.textContent =
    message;

  div.style.cssText = `
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    background:#3d2b1f;
    color:white;
    padding:10px 18px;
    border-radius:30px;
    z-index:10000;
    font-size:14px;
  `;

  document.body.appendChild(div);

  setTimeout(
    () => div.remove(),
    2200
  );

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function show(id){

  document
    .querySelectorAll(
      "main section"
    )
    .forEach(section => {

      section.style.display =
        section.id === id
          ? "block"
          : "none";

    });

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });

  const buttons =
    document.querySelectorAll(
      ".nav-btn"
    );

  buttons.forEach(btn => {

    const onclick =
      btn.getAttribute(
        "onclick"
      ) || "";

    if(
      onclick.includes(
        `show('${id}')`
      )
    ){

      btn.classList.add(
        "active"
      );

    }

  });

}


/* =====================================================
   LANGUAGE
   ===================================================== */

let currentLanguage =
  localStorage.getItem(
    "sanskritamLanguage"
  ) || "gu";


function changeLanguage(lang){

  currentLanguage = lang;

  localStorage.setItem(
    "sanskritamLanguage",
    lang
  );

  toast(
    lang === "gu"
      ? "ગુજરાતી પસંદ કરેલ"
      : lang === "hi"
      ? "हिन्दी चुनी गई"
      : "English selected"
  );

}


/* =====================================================
   SPEECH
   ===================================================== */

function speakText(text){

  if(
    !("speechSynthesis" in window)
  ){

    toast(
      "તમારા browserમાં voice support નથી."
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    /[\u0900-\u097F]/.test(text)
      ? "hi-IN"
      : "en-US";

  utterance.rate = 0.85;

  speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   INITIAL SECTION
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    show("home");

  }
);

</script>
